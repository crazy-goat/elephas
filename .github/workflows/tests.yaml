name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TB_VERSION: 0.17.4
  ZIG_VERSION: 0.14.1
  CACHE_VERSION: v2

jobs:
  changes:
    name: Changes
    uses: crazy-goat/.github/.github/workflows/changes.yml@main
    with:
      # Tests read CHANGELOG.md, CONTRIBUTING.md, README.md and .github/ISSUE_TEMPLATE/*, so they count as code.
      docs-regex: '^(AGENTS\.md|docs/.*|LICENSE.*|\.gitignore)$'

  docs:
    name: Docs
    uses: crazy-goat/.github/.github/workflows/docs-check.yml@main

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: ffi, gmp, bcmath

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install shellcheck
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" shellcheck-v0.11.0/shellcheck
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check shellcheck version
        run: shellcheck --version

      - name: Install hadolint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check hadolint version
        run: hadolint --version

      - name: Lint
        run: bin/lint.sh

  build-lib:
    name: Build native tb_client library
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore cached build artifacts
        id: cache-restore
        uses: actions/cache@v6
        with:
          path: |
            resources/lib
            ~/.cache/elephas
          key: tb-client-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.TB_VERSION }}-${{ env.ZIG_VERSION }}
          restore-keys: |
            tb-client-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.TB_VERSION }}-
            tb-client-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build native tb_client library
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: bash bin/build-tb-client.sh
        env:
          TB_VERSION: ${{ env.TB_VERSION }}
          ZIG_VERSION: ${{ env.ZIG_VERSION }}

      - name: Verify integrity of built library
        run: |
          set -euo pipefail
          echo "=== Verifying built library checksum ==="
          for lib in $(find resources/lib/ -type f -name 'libtb_client.*' 2>/dev/null); do
            echo "Library: $lib"
            ls -la "$lib"
            sha256sum "$lib"
          done
          # Verify the noop callback if present
          for noop in $(find resources/lib/ -type f -name 'libelephas_noop.*' 2>/dev/null); do
            echo "Noop callback: $noop"
            sha256sum "$noop"
          done

      - name: List built artifacts
        run: find resources/lib/ -type f -ls

  test-matrix:
    name: Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: [changes, build-lib]
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: ffi, gmp, bcmath
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Restore native tb_client library from cache
        id: cache-restore
        uses: actions/cache@v6
        with:
          path: |
            resources/lib
            ~/.cache/elephas
          key: tb-client-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.TB_VERSION }}-${{ env.ZIG_VERSION }}
          restore-keys: |
            tb-client-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.TB_VERSION }}-
            tb-client-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build native tb_client library (cache miss fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: bash bin/build-tb-client.sh
        env:
          TB_VERSION: ${{ env.TB_VERSION }}
          ZIG_VERSION: ${{ env.ZIG_VERSION }}

      - name: Run unit tests with coverage
        run: vendor/bin/phpunit --testsuite=unit --coverage-clover=coverage/clover.xml

      - name: Check coverage threshold
        if: matrix.php-version == '8.2'
        run: php bin/check-coverage.php coverage/clover.xml 80

      - name: Start TigerBeetle
        run: |
          # Verify the Docker image digest against a known good value for
          # ${{ env.TB_VERSION }}.  This ensures the pulled image matches
          # the expected build, preventing tag-squatting attacks.
          TB_IMAGE="ghcr.io/tigerbeetle/tigerbeetle:${{ env.TB_VERSION }}"
          echo "Pulling TigerBeetle image: $TB_IMAGE"
          docker pull "$TB_IMAGE" 2>&1
          # Log the image digest for traceability (CI will fail on pull error)
          docker inspect "$TB_IMAGE" --format '{{.RepoDigests}}'

          docker run --rm --privileged \
            -v /tmp/tb:/tmp/tb \
            "$TB_IMAGE" \
            format --cluster=0 --replica=0 --replica-count=1 /tmp/tb/data

          docker run -d --name tigerbeetle --rm --privileged \
            -p 3000:3000 \
            -v /tmp/tb:/tmp/tb \
            "$TB_IMAGE" \
            start --addresses=3000 --development /tmp/tb/data

          for i in $(seq 1 30); do
            if bash -c 'echo > /dev/tcp/localhost/3000' 2>/dev/null; then
              echo "TigerBeetle is ready"
              break
            fi
            echo "Waiting for TigerBeetle... ($i/30)"
            sleep 1
          done

      - name: Run functional tests
        run: vendor/bin/phpunit --testsuite=functional
        env:
          TIGERBEETLE_ADDRESS: localhost:3000

      - name: Stop TigerBeetle
        if: always()
        run: docker stop tigerbeetle || true

  tests:
    name: tests
    needs: [changes, docs, lint, build-lib, test-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi

  ci-ok:
    name: ci-ok
    needs: [changes, docs, lint, build-lib, test-matrix, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi
