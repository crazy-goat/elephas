name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG.md
        # Reads CHANGELOG.md from the tagged commit: merge the `## [X.Y.Z]` section before tagging.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { found = (index($0, "[" v "]") > 0 || index($0, "[v" v "]") > 0); next }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty section for ${version}"
            exit 1
          fi
          # GitHub rejects release notes over 125000 characters.
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import sys
          limit = 120000
          tag = sys.argv[1]
          text = open('release-notes.md', encoding='utf-8').read()
          if len(text) > limit:
              tail = ("\n\n_The notes were shortened because of the GitHub size limit. "
                      f"See [CHANGELOG.md](https://github.com/crazy-goat/elephas/blob/{tag}/CHANGELOG.md) "
                      "for the full text._\n")
              text = text[:limit - len(tail)]
              text = text[:text.rfind('\n')] + tail
              open('release-notes.md', 'w', encoding='utf-8').write(text)
              print(f"::warning::Release notes truncated to {len(text)} characters")
          PY

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build-libs:
    name: Build tb_client (${{ matrix.platform }})
    needs: notes
    if: ${{ !cancelled() && needs.notes.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            release-dir: x86_64-linux-gnu
            ext: so
            asset-name: libtb_client-x86_64-linux-gnu.so
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            release-dir: aarch64-linux-gnu
            ext: so
            asset-name: libtb_client-aarch64-linux-gnu.so
          - os: macos-15-intel
            platform: macos-amd64
            release-dir: x86_64-macos
            ext: dylib
            asset-name: libtb_client-x86_64-macos.dylib
          - os: macos-15
            platform: macos-arm64
            release-dir: aarch64-macos
            ext: dylib
            asset-name: libtb_client-aarch64-macos.dylib
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build tb_client
        run: bash bin/build-tb-client.sh

      - name: Stage release asset
        run: cp "resources/lib/${{ matrix.release-dir }}/libtb_client.${{ matrix.ext }}" "${{ matrix.asset-name }}"

      - name: Verify staged asset
        run: |
          set -euo pipefail
          ls -la "${{ matrix.asset-name }}"
          file "${{ matrix.asset-name }}"

      - name: Generate SHA256 checksum
        run: |
          set -euo pipefail
          sha256sum "${{ matrix.asset-name }}" > "${{ matrix.asset-name }}.sha256"
          cat "${{ matrix.asset-name }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tb_client-${{ matrix.platform }}
          path: |
            ${{ matrix.asset-name }}
            ${{ matrix.asset-name }}.sha256
          if-no-files-found: error

  release:
    name: Create Release
    needs: [notes, build-libs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: tb_client-*
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Generate combined SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum libtb_client-x86_64-linux-gnu.so \
                     libtb_client-aarch64-linux-gnu.so \
                     libtb_client-x86_64-macos.dylib \
                     libtb_client-aarch64-macos.dylib > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/libtb_client-x86_64-linux-gnu.so
            artifacts/libtb_client-x86_64-linux-gnu.so.sha256
            artifacts/libtb_client-aarch64-linux-gnu.so
            artifacts/libtb_client-aarch64-linux-gnu.so.sha256
            artifacts/libtb_client-x86_64-macos.dylib
            artifacts/libtb_client-x86_64-macos.dylib.sha256
            artifacts/libtb_client-aarch64-macos.dylib
            artifacts/libtb_client-aarch64-macos.dylib.sha256
            artifacts/SHA256SUMS.txt
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
